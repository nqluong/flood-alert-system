server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/flood-alert/api/v1/auth/**,
              /flood-alert/api/v1/roles/**,
              /flood-alert/api/v1/user-roles/**,
              /flood-alert/api/v1/users/**,
              /flood-alert/api/v1/fcm-tokens/**
          filters:
            - StripPrefix=1

        - id: floodcore-service
          uri: http://localhost:8083
          predicates:
            - Path=/flood-alert/api/v1/warnings/**,
              /flood-alert/api/v1/alerts/**,
              /flood-alert/api/v1/devices/**,
              /flood-alert/api/v1/sensors/**,
              /flood-alert/api/v1/admin/floods/**,
              /flood-alert/api/v1/core/floods/**,
              /flood-alert/api/v1/core/routes/**,
              /flood-alert/api/v1/reports/**,
          filters:
            - StripPrefix=1

        - id: ingestion-service
          uri: http://localhost:8082
          predicates:
            - Path=/flood-alert/api/admin/cache/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/flood-alert/api/v1/notifications/**
          filters:
            - StripPrefix=1

        - id: notification-service-websocket-sockjs
          uri: http://localhost:8085
          predicates:
            - Path=/flood-alert/ws-admin/**
          filters:
            - StripPrefix=1
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                strategy: RETAIN_FIRST

        - id: notification-service-websocket-native
          uri: http://localhost:8085
          predicates:
            - Path=/flood-alert/ws
          filters:
            - StripPrefix=1
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                strategy: RETAIN_FIRST

app:
  services:
    auth:
      url: http://localhost:8081/api/v1/auth/verify