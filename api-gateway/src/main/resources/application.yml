server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/roles/**, /api/v1/user-roles/**, /api/v1/user/**

        - id: floodcore-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/warnings/**, /api/v1/alerts/**, /api/v1/devices/**, /api/v1/sensors/**

app:
  services:
    auth:
        url: http://localhost:8081/api/v1/auth/verify