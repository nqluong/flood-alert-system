server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/flood-alert/api/v1/auth/**,
              /flood-alert/api/v1/roles/**,
              /flood-alert/api/v1/user-roles/**,
              /flood-alert/api/v1/user/**
          filters:
            - StripPrefix=1

        - id: floodcore-service
          uri: http://localhost:8083
          predicates:
            - Path=/flood-alert/api/v1/warnings/**,
              /flood-alert/api/v1/alerts/**,
              /flood-alert/api/v1/devices/**,
              /flood-alert/api/v1/sensors/**
          filters:
            - StripPrefix=1

        - id: ingestion-service
          uri: http://localhost:8082
          predicates:
            - Path=/flood-alert/api/admin/cache/**
          filters:
            - StripPrefix=1
app:
  services:
    auth:
      url: http://localhost:8081/api/v1/auth/verify