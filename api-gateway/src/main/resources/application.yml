server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/flood-alert/api/v1/auth/**,
              /flood-alert/api/v1/roles/**,
              /flood-alert/api/v1/user-roles/**,
              /flood-alert/api/v1/user/**
          filters:
            - StripPrefix=1

        - id: floodcore-service
          uri: http://localhost:8083
          predicates:
            - Path=/flood-alert/api/v1/warnings/**,
              /flood-alert/api/v1/alerts/**,
              /flood-alert/api/v1/devices/**,
              /flood-alert/api/v1/sensors/**
          filters:
            - StripPrefix=1

        - id: ingestion-service
          uri: http://localhost:8082
          predicates:
            - Path=/flood-alert/api/admin/cache/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/flood-alert/api/v1/notifications/**
          filters:
            - StripPrefix=1

        # Route WebSocket cho SockJS client (browser, SockJS lib)
        # SockJS tạo các sub-path: /ws-admin/info, /ws-admin/{server}/{session}/websocket
        # → tất cả đều khớp với /flood-alert/ws-admin/**
        - id: notification-service-websocket-sockjs
          uri: ws://localhost:8084
          predicates:
            - Path=/flood-alert/ws-admin/**
          filters:
            - StripPrefix=1

        # Route WebSocket thuần (native WS) — dùng cho Postman hoặc client không dùng SockJS
        # Client kết nối: ws://localhost:8080/flood-alert/ws
        # Sau khi connect → gửi STOMP SUBSCRIBE tới /topic/admin/alerts hoặc /topic/admin/map/telemetry
        - id: notification-service-websocket-native
          uri: ws://localhost:8084
          predicates:
            - Path=/flood-alert/ws
          filters:
            - StripPrefix=1
app:
  services:
    auth:
      url: http://localhost:8081/api/v1/auth/verify