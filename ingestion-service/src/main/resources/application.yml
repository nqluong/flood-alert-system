server:
  port: 8082
spring:
  application:
    name: ingention-service

mqtt:
  borker-url: tcp://localhost:1883
  client-id: ingention-service-${random.uuid}
  topic-pattern: floodguard/sensors/+/telemetry
  qos: 1
  auto-reconnect: true

kafka:
    bootstrap-servers: localhost:9092
    topic: iot-raw
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

