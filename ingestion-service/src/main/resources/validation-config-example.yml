# Validation Configuration Example
# Thêm vào application.yml của ingestion-service

app:
  validation:
    # Thời gian tối đa cho phép chênh lệch timestamp (giây)
    max-timestamp-drift-seconds: 300  # 5 phút
    
    # Mức nước tối thiểu (cm)
    min-water-level: 0.0
    
    # Mức nước tối đa (cm)
    max-water-level: 1000.0  # 10 mét
    
    # Redis key prefixes
    sensor-info-key-prefix: "sensor:info:"
    blacklist-key-prefix: "sensor:blacklist:"
