server:
  port: 8084
  tomcat:
    threads:
      max: 200
      min-spare: 10
spring:
  application:
    name: floodprocessor-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:${DB_URL_FLOODPROCESSOR}"
    username: ${DB_USERNAME_FLOODPROCESSOR}
    password: ${DB_PASSWORD_FLOODPROCESSOR}
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
        ddl-auto: none
    show-sql: false
    properties:
        hibernate:
            jdbc:
              batch_size: 50
            format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  config:
    import: classpath:key-redis.yml

app:
  kafka:
    topic:
      ingest: ${KAFKA_INGEST_TOPIC:iot-raw}
      output: ${KAFKA_OUTPUT_TOPIC:flood-sensor-data-processed}
      lifecycle: ${KAFKA_LIFECYCLE_TOPIC:flood-lifecycle-events}
      reputation: ${KAFKA_REPUTATION_TOPIC:reputation-update-events}
      sensor-health-sync: ${KAFKA_SENSOR_HEALTH_SYNC_TOPIC:sensor-health-sync}
      user-report: ${KAFKA_USER_REPORT_TOPIC:user-report-events}
    consumer:
        group-id: ${KAFKA_CONSUMER_GROUP_ID:flood-processor-group}
        concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
        max-poll-records: ${KAFKA_MAX_POLL_RECORDS:500}
        batch-listener: true
    user-report:
      consumer:
              group-id: ${KAFKA_USER_REPORT_CONSUMER_GROUP_ID:user-report-processor-group}
              concurrency: ${KAFKA_USER_REPORT_CONCURRENCY:2}

  aggregator:
    kafka:
      consumer:
        group-id: ${KAFKA_AGGREGATOR_GROUP_ID:flood-event-aggregator-group}
        concurrency: ${KAFKA_AGGREGATOR_CONCURRENCY:3}
        max-poll-records: ${KAFKA_AGGREGATOR_MAX_POLL_RECORDS:100}

  sensor-health:
    # Khoảng thời gian tối thiểu giữa 2 lần đồng bộ health (ms) - mặc định 5 phút
    sync-interval-ms: ${SENSOR_HEALTH_SYNC_INTERVAL_MS:300000}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}


gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com
  model: gemini-1.5-flash
  # Timeout tối đa cho mỗi lần gọi Gemini (giây). Giữ thấp để không nghẽn Kafka consumer.
  timeout-seconds: 5
  # Retry configuration
  retry:
    max-attempts: 3  # Số lần retry tối đa (không tính lần gọi đầu tiên)
    initial-delay-ms: 1000  # Delay ban đầu: 1 giây
    max-delay-ms: 5000  # Delay tối đa: 5 giây
    multiplier: 2.0  # Exponential backoff multiplier
