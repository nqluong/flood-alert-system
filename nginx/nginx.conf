worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_origin $cors_origin {
        "https://admin.luongnqdev.io.vn" "https://admin.luongnqdev.io.vn";
        "http://localhost:5173"          "http://localhost:5173";
        "http://localhost:5174"          "http://localhost:5174";
        default                          "";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $gw {
        default "api-gateway:8080";
    }

    server {
        listen 80 default_server;
        listen 443 ssl default_server;

        server_name _;

        ssl_certificate     /etc/letsencrypt/live/api.luongnqdev.io.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.luongnqdev.io.vn/privkey.pem;

        return 444;
    }

    server {
        listen 80;
        server_name api.luongnqdev.io.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.luongnqdev.io.vn;

        ssl_certificate     /etc/letsencrypt/live/api.luongnqdev.io.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.luongnqdev.io.vn/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /flood-alert/ws {
            proxy_pass http://$gw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /flood-alert/ws-admin {
            proxy_pass http://$gw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            add_header 'Access-Control-Allow-Origin'      $cors_origin                       always;
            add_header 'Access-Control-Allow-Credentials' 'true'                             always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
            add_header 'Strict-Transport-Security'        'max-age=31536000; includeSubDomains' always;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            limit_req zone=api burst=500 nodelay;

            proxy_pass http://$gw;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            proxy_hide_header X-Powered-By;
        }
    }
}