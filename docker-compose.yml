version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: flood-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - flood-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: flood-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - flood-network

  api-gateway:
    image: nqluong14/api-gateway:v1.0
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - ./api-gateway/.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - flood-network
    depends_on:
      auth-service:
        condition: service_healthy
      floodcore-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    image: nqluong14/auth-service:v1.2
    container_name: auth-service
    restart: unless-stopped
    # ports:
    #   - "8081:8081"
    env_file:
      - ./auth-service/.env
    volumes:
      - ./secrets/firebase-key.json:/app/secrets/firebase-key.json:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - FIREBASE_CONFIG_PATH=file:/app/secrets/firebase-key.json
    networks:
      - flood-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 384M

  floodcore-service:
    image: nqluong14/floodcore-service:v1.1
    container_name: floodcore-service
    restart: unless-stopped
    # ports:
    #   - "8083:8083"
    env_file:
      - ./floodcore-service/.env
    volumes:
      - ./secrets/firebase-key.json:/app/secrets/firebase-key.json:ro
      - ./logs/floodcore:/app/logs
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - FIREBASE_CONFIG_PATH=file:/app/secrets/firebase-key.json
    networks:
      - flood-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.2'
          memory: 768M

  floodprocessor-service:
    image: nqluong14/floodprocessor-service:v1.1
    container_name: floodprocessor-service
    restart: unless-stopped
    # ports:
    #   - "8084:8084"
    env_file:
      - ./floodprocessor-service/.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - flood-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3072M
        reservations:
          cpus: '0.5'
          memory: 1024M

  notification-service:
    image: nqluong14/notification-service:v1.2
    container_name: notification-service
    restart: unless-stopped
    # ports:
    #   - "8085:8085"
    env_file:
      - ./notification-service/.env
    volumes:
      - ./secrets/firebase-key.json:/app/secrets/firebase-key.json:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - FIREBASE_CONFIG_PATH=file:/app/secrets/firebase-key.json
    networks:
      - flood-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 512M

  ingestion-service:
    image: nqluong14/ingestion-service:v1.2
    container_name: ingestion-service
    restart: unless-stopped
    # ports:
    #   - "8082:8082"
    env_file:
      - ./ingestion-service/.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - flood-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - flood-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: apache/kafka:latest
    user: root
    hostname: kafka
    container_name: flood-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_HEAP_OPTS: "-Xmx1024M -Xms512M"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - flood-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.3'
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: flood-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--requirepass", "NguyenLuong1405",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--save", "900 1",
      "--save", "300 10",
      "--save", "60 10000"
    ]
    networks:
      - flood-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: flood-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: floodalert
      POSTGRES_PASSWORD: "@NguyenLuong1405"
      POSTGRES_DB: flood_alert_db
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - flood-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d flood_alert_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  flood-network:
    driver: bridge
    name: flood-network
