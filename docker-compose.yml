version: "3.8"

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  kafka:
    image: apache/kafka:latest
    hostname: kafka  # Đặt tên host là kafka cho dễ gọi
    container_name: flood-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Cấu hình Listeners (Quan trọng)
      # - CONTROLLER: Dành cho nội bộ Kafka quản lý
      # - INTERNAL: Dành cho các Service (Java, Kafka UI) chạy trong Docker kết nối
      # - EXTERNAL: Dành cho máy tính của bạn (Localhost) kết nối
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Tự động format ổ đĩa với ID này (Không cần chạy lệnh format tay)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Tối ưu RAM (Quan trọng cho VPS)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    # 4. KAFKA UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flood-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # LƯU Ý: Kết nối qua port nội bộ 29092 (như cấu hình ở trên)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "Nguyenluong1405" ]

volumes:
  redis_data:
  kafka_data: